[project]
name = "superbowl-ticket-price-tracker"
version = "1.0.0"
description = "Hourly Super Bowl ticket price tracker with email alerts"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "httpx>=0.27,<1",
    "playwright>=1.48,<2",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "beautifulsoup4>=4.12,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
